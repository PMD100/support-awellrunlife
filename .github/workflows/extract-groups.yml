# Extract Groups
#
# Reads the verified bereavement pages and extracts the actual support groups. This is
# the step that finally produces listings.
#
# An LLM reading a hospice page will happily invent a plausible meeting time. That is the
# worst failure available to this project, so the model is never trusted: every fact it
# reports must come with a verbatim quote, and Python checks that quote against the page.
# Unverifiable claims are discarded, not published.
#
# Requires an ANTHROPIC_API_KEY secret. Cost is cents per run at this scale.

name: Extract Groups

on:
  workflow_dispatch:
    inputs:
      limit:
        # Default deliberately blank. It used to prefill with "5", which meant three
        # separate runs all quietly processed five pages instead of sixty. A prefilled
        # cap that has to be cleared is a trap; blank means "do all of them".
        description: "Max organizations (LEAVE BLANK to process all)"
        type: string
        default: ""
      dry_run:
        description: "Extract and report, but write nothing"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Runs before any API call. If a guardrail has regressed, we find out for free
      # rather than after publishing an invented meeting time.
      - name: Verify extraction guardrails
        run: python3 scripts/extract/extract_groups.py --offline-test

      - name: Confirm the API key is present
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "API key present."

      - name: Extract groups
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then ARGS="--limit ${{ inputs.limit }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python3 scripts/extract/extract_groups.py $ARGS

      - name: Summarize
        if: ${{ !inputs.dry_run }}
        run: |
          {
            echo "## Extraction"
            echo ""
            cat data/extraction-report.md
            echo ""
            echo "<details><summary>Full audit table</summary>"
            echo ""
            cat data/extraction-audit.md
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open a pull request
        if: ${{ !inputs.dry_run }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/extracted-groups
          delete-branch: true
          commit-message: "Extracted support groups"
          title: "Data: extracted support groups"
          body: |
            Support groups extracted from verified bereavement pages.

            **Read `data/extraction-audit.md` in this diff before merging.** It lists every
            group beside the cost and schedule recorded for it. Spot-check a dozen against
            their source pages.

            **The "Rejected claims" section of the report is the important one.** Each line
            is something the model asserted that could not be traced to a verbatim quote on
            the page, and was therefore thrown away. A long list there means the guardrails
            are earning their keep.

            Anything without a verified schedule, or extracted at low confidence, is marked
            `needs_review` and cannot count toward a metro's publish threshold.
          labels: |
            data
            automated
